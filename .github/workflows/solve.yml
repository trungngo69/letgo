name: solve
run-name: solve ${{ inputs.at }}
on:
  workflow_dispatch:
    inputs:
      at: {description: attempt id, required: true}
      tmo: {description: solver seconds, default: "800"}
      cfgs: {description: JSON list of configs (optional), default: ""}
      bench: {description: "1 = benchmark only, no push", default: "0"}
permissions:
  contents: write
  actions: write
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(inputs.cfgs != '' && inputs.cfgs || '["pal-1","ypr-1","prb-1","pal-2","ypr-2","prb-2","ksat-1","cad-1"]') }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: solve
        env:
          GH_TOKEN: ${{ github.token }}
          AT: ${{ inputs.at }}
          PUSH: ${{ inputs.bench == '1' && '0' || '1' }}
        run: |
          echo "start $(date -u +%T.%N) ref=$GITHUB_REF sha=$GITHUB_SHA"
          chmod +x bin/* solve/run.sh
          xz -dc att.cnf.xz > f.cnf; head -c 200 f.cnf | grep "^p"
          solve/run.sh ${{ matrix.cfg }} ${{ inputs.tmo }} f.cnf
